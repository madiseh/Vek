name: Publish NuGet package

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Validate version tag
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ($tag -notmatch '^v\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') {
            throw "Tag '$tag' must be a version such as v1.2.3 or v1.2.3-preview.1."
          }
          "PACKAGE_VERSION=$($tag.Substring(1))" >> $env:GITHUB_ENV

      - name: Restore
        run: dotnet restore Vek.slnx

      - name: Build
        run: dotnet build Vek.slnx --configuration Release --no-restore

      - name: Pack DataGrid packages
        run: |
          dotnet pack src/Components/Blazor/Vek.Blazor.DataGrid/Vek.Blazor.DataGrid.csproj --configuration Release --no-build --no-restore -p:PackageVersion=$env:PACKAGE_VERSION
          dotnet pack src/Components/WPF/Vek.WPF.DataGrid/Vek.WPF.DataGrid.csproj --configuration Release --no-build --no-restore -p:PackageVersion=$env:PACKAGE_VERSION

      - name: NuGet login (OIDC)
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: AminSabaghi

      - name: Push package to NuGet
        shell: pwsh
        run: |
          $packageDirectory = Join-Path $env:GITHUB_WORKSPACE "VekNugetPackage"
          $packagePaths = @(
            (Join-Path $packageDirectory "Vek.Blazor.DataGrid.$env:PACKAGE_VERSION.nupkg"),
            (Join-Path $packageDirectory "Vek.WPF.DataGrid.$env:PACKAGE_VERSION.nupkg")
          )
          foreach ($packagePath in $packagePaths) {
            if (-not (Test-Path -LiteralPath $packagePath)) {
              throw "Expected package was not found at '$packagePath'."
            }
            dotnet nuget push $packagePath --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json
          }
