name: Publish NuGet package

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

env:
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  get-version:
    runs-on: ubuntu-latest
    outputs:
      VERSION: ${{ steps.get-version.outputs.VERSION }}
    steps:
      - uses: actions/checkout@v7

      - name: Get version
        id: get-version
        run: |
          VERSION="$(sed -n 's/.*<VersionPrefix>\([^<]*\)<\/VersionPrefix>.*/\1/p' src/Directory.Build.props | head -n 1)"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid VersionPrefix: $VERSION" >&2; exit 1; }
          if [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "${GITHUB_REF_NAME#v}" != "$VERSION" ]; then
            echo "Release tag ${GITHUB_REF_NAME} does not match VersionPrefix $VERSION in src/Directory.Build.props." >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

  deploy-nuget:
    runs-on: ubuntu-latest
    needs: get-version
    permissions:
      id-token: write
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          key: ${{ github.repository }}-nuget-${{ hashFiles('**/*.csproj') }}
          path: ${{ env.NUGET_PACKAGES }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.x'

      - name: Enable .NET 11 SDK
        run: rm -f global.json

      - name: Restore dependencies
        working-directory: src/Vek
        run: dotnet restore /p:IncludeNet11=true

      - name: Pack nuget package
        working-directory: ./src/Vek
        run: dotnet pack -c Release --no-restore --output nupkgs /p:Version=${{ needs.get-version.outputs.VERSION }} /p:IncludeNet11=true

      - name: Upload NuGet packages as artifact
        uses: actions/upload-artifact@v7
        with:
          name: vek-nuget-${{ needs.get-version.outputs.VERSION }}
          path: |
            ./src/Vek/nupkgs/*.nupkg
            ./src/Vek/nupkgs/*.snupkg
          if-no-files-found: error
          retention-days: 30

      - name: Check package contains css
        shell: pwsh
        run: ./tools/CheckPackageContainsStaticAssets.ps1 ./src/Vek/nupkgs Vek.min.css

      - name: Check package contains js
        shell: pwsh
        run: ./tools/CheckPackageContainsStaticAssets.ps1 ./src/Vek/nupkgs Vek.min.js

      - name: Check package contains target frameworks
        shell: pwsh
        run: |
          Add-Type -assembly "system.io.compression.filesystem"
          $nupkgFilePath = Get-ChildItem -Path ./src/Vek/nupkgs -Filter *.nupkg | Select-Object -First 1
          $zip = [io.compression.zipfile]::OpenRead($nupkgFilePath.FullName)
          $entries = $zip.Entries.FullName
          $required = @('lib/net8.0/Vek.dll', 'lib/net9.0/Vek.dll', 'lib/net10.0/Vek.dll', 'lib/net11.0/Vek.dll')
          try {
            foreach ($tfm in $required) {
              if (-not $entries.Contains($tfm)) {
                Write-Error "Package $nupkgFilePath is missing $tfm"
                exit 1
              }
              Write-Host "Verified $tfm is present in package"
            }
          } finally {
            $zip.Dispose()
          }

      - name: NuGet login (OIDC)
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: AminSabaghi

      - name: Publish to NuGet.org
        working-directory: ./src/Vek
        run: dotnet nuget push nupkgs/*.nupkg --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Publish to GitHub Packages
        working-directory: ./src/Vek
        run: dotnet nuget push nupkgs/*.nupkg --api-key ${{ secrets.GITHUB_TOKEN }} --source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json --skip-duplicate

      - name: Attach packages to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "v${{ needs.get-version.outputs.VERSION }}" ./src/Vek/nupkgs/*.nupkg ./src/Vek/nupkgs/*.snupkg --clobber

  deploy-website:
    name: Deploy vekui.dev
    needs: [get-version, deploy-nuget]
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/deploy-vek.yml
    with:
      version: ${{ needs.get-version.outputs.VERSION }}
    secrets:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
      VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
