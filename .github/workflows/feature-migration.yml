name: autonomous-feature-migration

on:
  schedule:
    - cron: '0 9 * * *'  # Runs daily at 09:00 UTC
  workflow_dispatch:
    inputs:
      feature_id:
        description: 'Specific Feature ID from backlog.json (leave empty for next ready feature)'
        required: false
        default: ''

concurrency:
  group: autonomous-feature-migration
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  migrate-feature:
    runs-on: windows-latest
    steps:
      - name: Checkout Target Repository (Project A)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Select Next Feature from Backlog
        id: select-feature
        run: |
          python migration/scripts/orchestrator.py

      - name: Verify Clean Working Tree & Brand Anonymity
        run: |
          git grep -i -E "dev""express" -- ":!.github/workflows/*" && exit 1 || echo "Brand anonymity verified: 0 violations."
