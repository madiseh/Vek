name: deploy-vek-HEAD

on:
  workflow_dispatch:

jobs:
  deploy-web-app:
    name: Deploy HEAD to web app to vek.com
    if: ${{ github.repository_owner == 'Vek' }}
    uses: Vek/Workflows/.github/workflows/template-deploy-web-app.yml@main
    with:
      web-app-name: vek
      web-app-slot-name:  'staging'
      swap-slots: true
      project-directory: ./src/Docs/Vek.Docs.WasmHost
    secrets:
      publish-profile: ${{ secrets.PUBLISH_VEK }}
      azure-cred: ${{ secrets.AZURE_CREDENTIALS_VEK_PROD }}
