name: Deploy vekui.dev

on:
  workflow_call:
    inputs:
      version:
        description: Stable release version without the v prefix
        required: true
        type: string
    secrets:
      VPS_HOST:
        required: true
      VPS_USER:
        required: true
      VPS_SSH_PRIVATE_KEY:
        required: true
      VPS_KNOWN_HOSTS:
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: Stable release version without the v prefix
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    name: Publish website to Linux VPS
    runs-on: ubuntu-latest
    environment: production
    env:
      VPS_SSH_PORT: ${{ vars.VPS_SSH_PORT || '22' }}
      VPS_DEPLOY_PATH: ${{ vars.VPS_DEPLOY_PATH }}
      VPS_SERVICE_NAME: ${{ vars.VPS_SERVICE_NAME }}
      VERSION: ${{ inputs.version }}
    steps:
      - name: Validate deployment settings
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid stable version: $VERSION" >&2; exit 1; }
          [[ -n "$VPS_HOST" && -n "$VPS_USER" && -n "$VPS_SSH_PRIVATE_KEY" && -n "$VPS_KNOWN_HOSTS" ]] || { echo "Set all required VPS SSH secrets before deploying." >&2; exit 1; }
          [[ "$VPS_HOST" =~ ^[A-Za-z0-9.-]+$ ]] || { echo "VPS_HOST must be a hostname or IPv4 address." >&2; exit 1; }
          [[ "$VPS_USER" =~ ^[A-Za-z_][A-Za-z0-9_-]*$ ]] || { echo "VPS_USER must be a Linux account name." >&2; exit 1; }
          [[ "$VPS_DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]] || { echo "Set VPS_DEPLOY_PATH to an absolute path using only letters, numbers, dots, underscores, slashes, and hyphens." >&2; exit 1; }
          [[ "$VPS_SERVICE_NAME" =~ ^[A-Za-z0-9_.@-]+\.service$ ]] || { echo "Set VPS_SERVICE_NAME to a systemd unit name ending in .service." >&2; exit 1; }
          [[ "$VPS_SSH_PORT" =~ ^[0-9]+$ ]] && (( VPS_SSH_PORT > 0 && VPS_SSH_PORT < 65536 )) || { echo "VPS_SSH_PORT must be between 1 and 65535." >&2; exit 1; }

      - name: Check out the released source
        uses: actions/checkout@v7
        with:
          ref: v${{ inputs.version }}
          persist-credentials: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.x

      - name: Publish the website for Linux x64
        env:
          VERSION: ${{ inputs.version }}
        run: >-
          dotnet publish src/Vek.Docs.WasmHost/Vek.Docs.WasmHost.csproj
          --configuration Release
          --framework net10.0
          --runtime linux-x64
          --self-contained true
          --output "$RUNNER_TEMP/vekui-publish"
          -p:Version="$VERSION"

      - name: Configure SSH
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
          {
            echo "SSH_DESTINATION=$VPS_USER@$VPS_HOST"
            echo "REMOTE_RELEASE_PATH=${VPS_DEPLOY_PATH%/}/releases/$VERSION"
          } >> "$GITHUB_ENV"

      - name: Copy release to the VPS
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/id_ed25519" -p "$VPS_SSH_PORT" -o BatchMode=yes "$SSH_DESTINATION" \
            "mkdir -p -- '$REMOTE_RELEASE_PATH'"
          tar -C "$RUNNER_TEMP/vekui-publish" -czf - . | \
            ssh -i "$HOME/.ssh/id_ed25519" -p "$VPS_SSH_PORT" -o BatchMode=yes "$SSH_DESTINATION" \
              "tar -xzf - -C '$REMOTE_RELEASE_PATH'"

      - name: Activate release
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/id_ed25519" -p "$VPS_SSH_PORT" -o BatchMode=yes "$SSH_DESTINATION" \
            "bash -s -- '$VPS_DEPLOY_PATH' '$VPS_SERVICE_NAME' '$VERSION'" <<'REMOTE'
          set -euo pipefail
          deploy_root="$1"
          service_name="$2"
          version="$3"
          previous_release="$(readlink -f "$deploy_root/current" 2>/dev/null || true)"
          restore_previous_release() {
            if [[ -n "$previous_release" ]]; then
              ln -sfn "$previous_release" "$deploy_root/current.rollback"
              mv -Tf "$deploy_root/current.rollback" "$deploy_root/current"
              sudo -n systemctl restart "$service_name" || true
            fi
          }
          trap restore_previous_release ERR
          if [[ -n "$previous_release" ]]; then
            ln -sfn "$previous_release" "$deploy_root/previous"
          fi
          ln -sfn "$deploy_root/releases/$version" "$deploy_root/current.next"
          mv -Tf "$deploy_root/current.next" "$deploy_root/current"
          sudo -n systemctl restart "$service_name"
          sudo -n systemctl is-active --quiet "$service_name"
          trap - ERR
          REMOTE

      - name: Verify vekui.dev
        id: health-check
        shell: bash
        run: curl --fail --location --silent --show-error --retry 12 --retry-delay 5 --retry-connrefused https://vekui.dev/

      - name: Roll back if the site health check fails
        if: ${{ failure() && steps.health-check.outcome == 'failure' }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/id_ed25519" -p "$VPS_SSH_PORT" -o BatchMode=yes "$SSH_DESTINATION" \
            "bash -s -- '$VPS_DEPLOY_PATH' '$VPS_SERVICE_NAME'" <<'REMOTE'
          set -euo pipefail
          deploy_root="$1"
          service_name="$2"
          previous_release="$(readlink -f "$deploy_root/previous" 2>/dev/null || true)"
          if [[ -z "$previous_release" ]]; then
            echo "No previous release is available for rollback." >&2
            exit 1
          fi
          ln -sfn "$previous_release" "$deploy_root/current.rollback"
          mv -Tf "$deploy_root/current.rollback" "$deploy_root/current"
          sudo -n systemctl restart "$service_name"
          sudo -n systemctl is-active --quiet "$service_name"
          REMOTE
