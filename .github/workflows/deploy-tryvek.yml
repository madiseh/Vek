name: deploy-tryvek

on:
  workflow_dispatch:
  push:
    tags: 
      - "v9.[0-9]+.[0-9]+"

jobs:
  wait-for-nuget:
    name: Wait for nuget
    runs-on: ubuntu-latest
    steps:
    - name: Wait for nuget
      if: ${{ github.ref_type == 'tag' }}
      run: sleep 600s


  deploy-web-app:
    name: Deploy web app to try.vek.com
    needs: wait-for-nuget
    if: ${{ github.repository_owner == 'Vek' }}
    uses: Vek/Workflows/.github/workflows/template-deploy-web-app.yml@main
    with:
      checkout-repository: Vek/TryVek
      checkout-ref: main
      web-app-name: tryvek
      web-app-slot-name:  'staging'
      swap-slots: true
      project-directory: './src/TryVek.Server'
      second-project-directory: './src/TryVek.Client'
    secrets:
      publish-profile: ${{ secrets.PUBLISH_TRY_VEK }}
      azure-cred: ${{ secrets.AZURE_CREDENTIALS_TRY_PROD }}
